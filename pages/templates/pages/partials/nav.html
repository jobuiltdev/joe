{% load static %}
<header class="bar" id="bar">
  <div class="shell bar__inner">
    <a class="bar__mark" href="#top" aria-label="Joseph Edward — back to top">
      <span class="bar__mark-short">JE</span>
      <span class="bar__mark-full">Joseph Edward</span>
    </a>

    <div class="bar__right">
      <button class="bar__theme" id="theme-toggle" type="button"
              aria-label="Switch colour theme">
        <svg class="bar__theme-icon" viewBox="0 0 24 24" width="18" height="18"
             fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" aria-hidden="true">
          <circle class="bar__sun" cx="12" cy="12" r="4.2"/>
          <g class="bar__rays">
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2"/>
            <path d="M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
          </g>
          <path class="bar__moon" d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
        </svg>
      </button>

      <button class="bar__menu mono" id="menu-toggle" type="button"
              aria-expanded="false" aria-controls="menu">
        <span class="bar__menu-label" data-open="Menu" data-close="Close"></span>
        <span class="bar__menu-glyph" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </div>
  <div class="bar__rule"></div>
</header>

<nav class="menu" id="menu" aria-label="Main" data-state="closed">
  <div class="menu__sheet">
    <div class="shell menu__inner">
      <ul class="menu__list">
        {% for item in nav_items %}
          <li class="menu__item">
            <a class="menu__link" href="#{{ item.slug }}" data-nav-link="{{ item.slug }}">
              <span class="menu__num mono">{{ item.index }}</span>
              <span class="menu__word">{{ item.label }}</span>
              <span class="menu__underline" aria-hidden="true"></span>
            </a>
          </li>
        {% endfor %}
      </ul>

      <div class="menu__foot">
        <ul class="menu__socials">
          {% for s in socials %}
            <li><a class="ln mono" href="{{ s.url }}" target="_blank" rel="noopener noreferrer">{{ s.label }}</a></li>
          {% endfor %}
        </ul>
        <a class="menu__email" href="mailto:{{ profile.email }}">{{ profile.email }}</a>
      </div>
    </div>
  </div>
</nav>
