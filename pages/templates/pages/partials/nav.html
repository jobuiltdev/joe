{% load static %}
<header class="bar" id="bar">
  <div class="shell bar__inner">
    <a class="bar__mark" href="#top" data-nav-link="top">
      <span class="bar__mark-short">JE</span>
      <span class="bar__mark-full">Joseph Edward</span>
    </a>
    <span class="bar__meta mono">{{ profile.location }}</span>
  </div>
  <div class="bar__rule"></div>
</header>

{# Floating rail. Collapsed it is a pill; hover or focus expands it to labels. #}
<nav class="rail" id="rail" aria-label="Sections">
  <div class="rail__pill">
    <a class="rail__avatar" href="#top" data-nav-link="top" aria-label="Back to top">
      <picture>
        <source srcset="{% static 'images/avatar.webp' %}" type="image/webp">
        <img src="{% static 'images/avatar.jpg' %}" width="400" height="400"
             alt="Joseph Edward" decoding="async">
      </picture>
      <span class="rail__ring" aria-hidden="true"></span>
    </a>

    <span class="rail__divider" aria-hidden="true"></span>

    <ul class="rail__list">
      {% for item in nav_items %}
        <li>
          <a class="rail__item" href="#{{ item.slug }}" data-nav-link="{{ item.slug }}">
            <span class="rail__dot" aria-hidden="true"></span>
            <span class="rail__num mono" aria-hidden="true">{{ item.index }}</span>
            <span class="rail__label">{{ item.label }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>

    <span class="rail__divider" aria-hidden="true"></span>

    <button class="rail__theme" id="theme-toggle" type="button"
            aria-label="Switch colour theme">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle class="bar__sun" cx="12" cy="12" r="4.2"/>
        <g class="bar__rays">
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2"/>
          <path d="M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
        </g>
        <path class="bar__moon" d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
      </svg>
    </button>
  </div>
</nav>
